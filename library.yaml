# The library of damstack: the platforms and apps it offers. damstack reads
# this file, at most once an hour. A stack joins with a pull request.
stacks:
  - name: hashi
    url: https://github.com/eugene-panin/damstack-hashi
    description: Nomad, Consul and Vault on one server, admin pages behind WireGuard

  - name: mail
    kind: app
    platform: hashi
    url: https://github.com/eugene-panin/damstack-mail
    description: your own mail server, by Stalwart

  - name: odoo
    kind: app
    platform: hashi
    url: https://github.com/eugene-panin/damstack-odoo
    description: Odoo ERP with its PostgreSQL and the Newo addons

  - name: postgres
    kind: app
    platform: hashi
    url: https://github.com/eugene-panin/damstack-postgres
    description: a shared PostgreSQL other apps use in postgres.mode external
